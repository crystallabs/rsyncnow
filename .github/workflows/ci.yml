name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', ruby]
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install rsync and sshd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync openssh-server
          sudo systemctl start ssh

      # Test group ssh is skipped if ssh to localhost doesn't work, so make
      # sure here that it does
      - name: Enable ssh to localhost
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan localhost >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost 'command -v rsync'

      - name: Run tests
        run: test/run.sh

  gem:
    name: Gem
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # For attaching the gem to a release
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Check that gem version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(ruby -e 'puts Gem::Specification.load("rsyncnow.gemspec").version')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG doesn't match version $version in rsyncnow.gemspec"
            exit 1
          fi

      - name: Build gem
        run: gem build rsyncnow.gemspec

      - name: Install gem
        run: gem install rsyncnow-*.gem

      - name: Install rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync

      - name: Run local tests with the installed gem
        run: RSYNCNOW=$(command -v rsyncnow) test/run.sh local extra

      - uses: actions/upload-artifact@v7
        with:
          name: gem
          path: rsyncnow-*.gem
          if-no-files-found: error

      - name: Attach gem to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" rsyncnow-*.gem --clobber
